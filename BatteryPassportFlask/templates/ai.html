<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Insights | VoltTrace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand-wrap">
                <div class="brand-mark">V</div>
                <div>
                    <p class="brand-name">VoltTrace</p>
                    <span class="brand-tag">AI insights</span>
                </div>
            </div>
            <div class="top-actions">
                <a class="nav-button secondary" href="{{ url_for('home') }}">Dashboard</a>
                <a class="nav-button secondary" href="{{ url_for('admin') }}">Admin</a>
            </div>
        </header>

        <main class="ai-page">
            <section class="ai-layout">
                <article class="card ai-sidebar">
                    <p class="eyebrow">Fleet snapshot</p>
                    <h2>Battery focus</h2>
                    <p class="assist-copy">Choose a battery or ask for a fleet-wide recommendation.</p>
                    <form method="get" action="{{ url_for('ai_insights') }}" class="mini-form">
                        <label for="battery_id" class="field-group">
                            <span>Battery</span>
                            <select id="battery_id" name="battery_id">
                                <option value="">All batteries</option>
                                {% for battery in batteries %}
                                <option value="{{ battery['battery_id'] }}" {% if battery['battery_id'] == selected_battery %}selected{% endif %}>{{ battery['battery_id'] }}</option>
                                {% endfor %}
                            </select>
                        </label>
                        <button type="submit" class="secondary-btn compact">Load focus</button>
                    </form>
                </article>

                <article class="card ai-main">
                    <p class="eyebrow">AI advisory</p>
                    <h1>Ask the battery assistant</h1>
                    <form method="post" action="{{ url_for('ai_insights') }}" class="ai-form">
                        <input type="hidden" name="battery_id" value="{{ selected_battery }}">
                        <label for="question" class="field-group">
                            <span>Question</span>
                            <textarea id="question" name="question" rows="4" placeholder="Example: Which batteries need attention? or assess battery BATT-1001 health.">{{ question }}</textarea>
                        </label>
                        <div class="button-stack">
                            <button class="primary-btn compact" type="submit">Ask AI</button>
                            <a class="secondary-btn compact" href="{{ url_for('ai_insights') }}">Reset</a>
                        </div>
                    </form>

                    {% if answer %}
                    <div class="response-box">
                        <p class="response-label">AI response</p>
                        <p>{{ answer }}</p>
                    </div>
                    {% endif %}
                </article>
            </section>
        </main>
    </div>
</body>
</html>
