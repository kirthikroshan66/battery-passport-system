<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | VoltTrace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-shell auth-shell">
        <div class="auth-card">
            <p class="eyebrow">Secure access</p>
            <h1>Admin login</h1>
            {% if error %}
            <div class="message error-message">{{ error }}</div>
            {% endif %}
            <form method="post" class="auth-form">
                <div class="field-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" value="admin" required>
                </div>
                <div class="field-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Enter admin password" required>
                </div>
                <button type="submit" class="primary-btn auth-btn">Sign in</button>
            </form>
            <a class="text-link" href="{{ url_for('home') }}">← Return to dashboard</a>
        </div>
    </div>
</body>
</html>
